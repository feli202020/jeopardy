<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy – Gamemaster Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1828;
    --surface2: #232134;
    --border: #2e2b45;
    --gold: #f5c842;
    --gold-light: #fde68a;
    --gold-glow: rgba(245,200,66,.18);
    --blue-light: #a5b4fc;
    --red: #f87171;
    --green: #34d399;
    --text: #f0eeff;
    --text-muted: #7c7a96;
    --radius: 14px;
    --radius-sm: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 20px;
    width: 100%;
  }

  .logo { font-family: 'Oswald', sans-serif; font-size: 3.5rem; font-weight: 700; letter-spacing: 8px; color: var(--gold); text-shadow: 0 0 60px var(--gold-glow); text-align: center; }
  .logo-sub { text-align: center; color: var(--text-muted); font-size: .85rem; letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 40px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .divider { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: .75rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }
  .field-hint { font-size: .72rem; color: var(--text-muted); }

  input[type=text], input[type=password] {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  input:focus { border-color: var(--gold); }

  .btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 1rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-gold { background: var(--gold); color: #0f0e17; box-shadow: 0 2px 16px rgba(245,200,66,.3); }
  .btn-gold:hover:not(:disabled) { background: var(--gold-light); transform: translateY(-1px); box-shadow: 0 4px 24px rgba(245,200,66,.45); }
  .btn-blue { background: rgba(99,102,241,.1); color: var(--blue-light); border: 1.5px solid rgba(99,102,241,.4); }
  .btn-blue:hover:not(:disabled) { background: rgba(99,102,241,.2); border-color: var(--blue-light); transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  .error-msg { color: var(--red); font-size: .85rem; text-align: center; min-height: 18px; }
  .success-msg { color: var(--green); font-size: .85rem; text-align: center; min-height: 18px; }

  .back-link { text-align: center; font-size: .85rem; color: var(--text-muted); }
  .back-link a { color: var(--gold); text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="logo">JEOPARDY</div>
    <div class="logo-sub">Gamemaster Login</div>
  </div>

  <div class="card">
    <div class="field">
      <div class="field-label">Benutzername</div>
      <input type="text" id="userInput" placeholder="z.B. felix42" maxlength="16" autocomplete="username" autofocus>
      <div class="field-hint">4–16 Zeichen · Buchstaben, Zahlen, _ oder -</div>
    </div>
    <div class="field">
      <div class="field-label">Passwort</div>
      <input type="password" id="pwInput" placeholder="••••" maxlength="16" autocomplete="current-password">
      <div class="field-hint">4–16 Zeichen</div>
    </div>

    <div id="errMsg" class="error-msg"></div>
    <div id="sucMsg" class="success-msg"></div>

    <button class="btn btn-gold" id="btnLogin" onclick="doLogin()">Anmelden →</button>
    <div class="divider">noch kein Konto?</div>
    <button class="btn btn-blue" id="btnRegister" onclick="doRegister()">Konto erstellen</button>
  </div>

  <div class="back-link"><a href="/">← Zurück zur Startseite</a></div>
</div>

<script>
function setBtn(id, disabled, text) {
  const b = document.getElementById(id);
  b.disabled = disabled;
  b.textContent = text;
}

async function doLogin() {
  const username = document.getElementById('userInput').value.trim();
  const password = document.getElementById('pwInput').value;
  document.getElementById('errMsg').textContent = '';
  document.getElementById('sucMsg').textContent = '';
  if (!username || !password) return document.getElementById('errMsg').textContent = 'Bitte alle Felder ausfüllen.';

  setBtn('btnLogin', true, '…');
  setBtn('btnRegister', true, '…');
  try {
    const res = await fetch('/api/auth/user-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('sucMsg').textContent = 'Willkommen, ' + data.username + '!';
      setTimeout(() => { window.location.href = '/gamemaster.html'; }, 500);
    } else {
      document.getElementById('errMsg').textContent = data.error || 'Anmeldung fehlgeschlagen';
      setBtn('btnLogin', false, 'Anmelden →');
      setBtn('btnRegister', false, 'Konto erstellen');
    }
  } catch {
    document.getElementById('errMsg').textContent = 'Verbindungsfehler';
    setBtn('btnLogin', false, 'Anmelden →');
    setBtn('btnRegister', false, 'Konto erstellen');
  }
}

async function doRegister() {
  const username = document.getElementById('userInput').value.trim();
  const password = document.getElementById('pwInput').value;
  document.getElementById('errMsg').textContent = '';
  document.getElementById('sucMsg').textContent = '';
  if (!username || !password) return document.getElementById('errMsg').textContent = 'Bitte alle Felder ausfüllen.';

  setBtn('btnLogin', true, '…');
  setBtn('btnRegister', true, '…');
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('sucMsg').textContent = 'Konto erstellt! Melde dich jetzt an.';
      document.getElementById('pwInput').value = '';
    } else {
      document.getElementById('errMsg').textContent = data.error || 'Registrierung fehlgeschlagen';
    }
  } catch {
    document.getElementById('errMsg').textContent = 'Verbindungsfehler';
  }
  setBtn('btnLogin', false, 'Anmelden →');
  setBtn('btnRegister', false, 'Konto erstellen');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
